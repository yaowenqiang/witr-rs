name: release

# Build release binaries for every supported target and attach them to a
# GitHub Release. Triggers on v* tags; workflow_dispatch builds without
# publishing (handy for testing the matrix).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64 linux needs a cross toolchain; `cross` provides one via docker
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Tests (linux x86_64 gate)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --release

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cross }}" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          staging="witr-rs-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/witr-rs" "$staging/"
          cp README.md README.en.md LICENSE "$staging/"
          tar czf "witr-rs-${{ matrix.target }}.tar.gz" "$staging"
          # linux has sha256sum, macOS only ships shasum -a 256
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "witr-rs-${{ matrix.target }}.tar.gz" \
              > "witr-rs-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "witr-rs-${{ matrix.target }}.tar.gz" \
              > "witr-rs-${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $staging = "witr-rs-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/witr-rs.exe" $staging
          Copy-Item README.md, README.en.md, LICENSE $staging
          Compress-Archive -Path $staging -DestinationPath "witr-rs-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/sha256sums.txt
          generate_release_notes: true
