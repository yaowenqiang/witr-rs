name: ci

# Regression gate for every push and PR — the release workflow only runs on
# v* tags, so without this nothing is tested until someone releases. The
# two cross-target checks keep all three platform modules type-validating
# from one host (the reason they carry explicit non-native stubs).

on:
  push:
    branches: [main]
  pull_request:

# contents: write lets the failure path append the captured test log to the
# ci-logs branch — the one place readable without repo-admin API access
# (raw logs, job summaries and artifacts are all sign-in-gated).
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # debug, not --release: profile.release carries fat LTO and the
      # release *test*-binary link OOM-kills rustc on memory-capped runners
      # (SIGKILL in under a minute, both on a 1GB box and in CI). The
      # assertions are identical; the release workflow builds the real
      # fat-LTO artifact per target on tags. Tee the log so a failure can
      # be diagnosed from the step below without repo-admin API access.
      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee /tmp/test-log.txt

      - name: Failure diagnostics
        if: failure()
        run: |
          {
            echo "## CI failure diagnostics"
            echo '```'
            echo '$ nproc'; nproc
            echo '$ free -h'; free -h
            echo '$ df -h /'; df -h /
            echo '$ rustc --version'; rustc --version || true
            echo '$ cargo --version'; cargo --version || true
            echo '```'
            echo "## test log (last 200 lines)"
            echo '```'
            tail -n 200 /tmp/test-log.txt 2>/dev/null || echo "(no test log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test-log.txt
          if-no-files-found: ignore

      - name: Persist test log to ci-logs branch
        if: failure()
        run: |
          set -e
          git config user.name "witr-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code origin ci-logs >/dev/null 2>&1; then
            git fetch --depth=1 origin ci-logs
            git checkout -B ci-logs FETCH_HEAD
          else
            git checkout --orphan ci-logs
            git rm -rf --cached . -q
          fi
          mkdir -p logs
          {
            echo "run: ${{ github.run_id }}  sha: ${{ github.sha }}"
            echo
            echo '$ nproc'; nproc
            echo '$ free -h'; free -h
            echo '$ df -h /'; df -h /
            echo '$ rustc/cargo'; rustc --version || true; cargo --version || true
            echo
            echo '== cargo test log =='
            cat /tmp/test-log.txt
          } > "logs/run-${{ github.run_id }}.txt"
          git add logs
          git commit -m "ci: test log for run ${{ github.run_id }}"
          git push origin ci-logs

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      # type-check the platform modules for the other hosts (no linking)
      - name: Cross-target checks
        run: |
          cargo check --target x86_64-unknown-linux-musl
          cargo check --target x86_64-pc-windows-msvc
