name: ci

# Regression gate for every push and PR — the release workflow only runs on
# v* tags, so without this nothing is tested until someone releases. The
# two cross-target checks keep all three platform modules type-validating
# from one host (the reason they carry explicit non-native stubs).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      # debug, not --release: profile.release carries fat LTO and the
      # release *test*-binary link OOM-kills rustc on memory-capped hosts
      # (reproduced on a 1GB box). The assertions are identical; the
      # release workflow builds the real fat-LTO artifact per target on
      # tags. Tee the log so a failure can be diagnosed from the steps
      # below without repo-admin API access.
      - name: Test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee /tmp/test-log.txt

      - name: Failure diagnostics
        if: failure()
        run: |
          # failing test names as check annotations — the annotations API is
          # anonymously readable, unlike logs and artifacts
          awk '/^failures:$/{f=1;next} f&&/^    /{sub(/^ +/,"");print} f&&/^$/{f=0}' /tmp/test-log.txt 2>/dev/null \
            | sort -u | head -n 20 \
            | while read -r t; do echo "::error title=failing test::$t"; done
          {
            echo "## CI failure diagnostics"
            echo '```'
            echo '$ nproc'; nproc
            echo '$ free -h'; free -h
            echo '$ df -h /'; df -h /
            echo '$ rustc --version'; rustc --version || true
            echo '$ cargo --version'; cargo --version || true
            echo '```'
            echo "## test log (last 200 lines)"
            echo '```'
            tail -n 200 /tmp/test-log.txt 2>/dev/null || echo "(no test log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test-log.txt
          if-no-files-found: ignore

      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings

      # type-check the platform modules for the other hosts (no linking)
      - name: Cross-target checks
        run: |
          cargo check --target x86_64-unknown-linux-musl
          cargo check --target x86_64-pc-windows-msvc
