[package]
name = "witr-rs"
version = "0.1.0"
edition = "2021"
description = "Why is this running? — trace processes, ports and files back to what started them (Rust, inspired by pranshuparmar/witr)"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = true
lto = true
